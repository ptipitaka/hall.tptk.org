name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install "pymupdf>=1.24,<2"
          pip install -e packages/pali_script/python
      - name: CS Roman unit tests
        run: python -m unittest discover -s books/cs-roman/scripts -p "test_*.py" -q
      - name: pali_script unit tests
        run: python -m unittest discover -s packages/pali_script/tests -q
