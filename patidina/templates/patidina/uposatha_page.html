{% extends "patidina/_base.html" %}

{% block title %}วันพระ พ.ศ. {{ be_year }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a class="btn btn-sm btn-light" href="{% url 'patidina:uposatha_year' prev_year %}">‹ {{ prev_year }}</a>
        <h1 class="h4 mb-0">วันพระ {{ be_year }}</h1>
        <a class="btn btn-sm btn-light" href="{% url 'patidina:uposatha_year' next_year %}">{{ next_year }} ›</a>
    </div>
    {% include "patidina/uposatha-dates-widget.html" %}
    <p class="mt-3"><a href="{% url 'patidina:widget' %}">กลับ Patidina</a></p>
</div>
{% endblock %}
